[project]
name = "qlink-replication"
version = "0.1.0"
description = "Standalone, modular Q-LINK trajectory variance empirical replication."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qulacs>=0.6.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
theory = [
    "sympy>=1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qlink_replication"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
